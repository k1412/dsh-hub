services:
  hub:
    image: ${DSH_HUB_IMAGE:-ghcr.io/k1412/dsh-hub:latest}
    build:
      context: ../..
      dockerfile: deploy/hub/Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    ports:
      - "127.0.0.1:${DSH_HUB_BIND_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DSH_HUB_HOST: "0.0.0.0"
      DSH_HUB_STATE_DIRECTORY: /var/lib/dsh-hub
      DSH_HUB_STATIC_DIRECTORY: /app/public
    volumes:
      - hub-state:/var/lib/dsh-hub
      - ./backups:/backup
    stop_grace_period: 30s

volumes:
  hub-state:
