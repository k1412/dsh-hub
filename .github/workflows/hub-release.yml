name: Hub Release

on:
  push:
    tags:
      - 'hub-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing hub-v* tag to publish after an infrastructure-only retry
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: '22.22.1'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  release:
    name: Verify and publish Hub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Validate tag version
        run: |
          release_tag="${{ inputs.release_tag || github.ref_name }}"
          case "$release_tag" in
            hub-v*) ;;
            *) echo "release tag must start with hub-v" >&2; exit 1 ;;
          esac
          release_version="${release_tag#hub-v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$release_version" = "$package_version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run hub:typecheck
      - run: pnpm run hub:lint
      - run: pnpm run hub:test
      - run: pnpm run hub:web:build
      - run: pnpm run docs:check
      - run: pnpm run repo:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run hub:web:csp:verify
      - run: pnpm run hub:server:verify
      - run: pnpm run hub:release:pack
      - run: pnpm run hub:release:verify
      - name: Publish Linux AMD64 container
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${{ inputs.release_tag || github.ref_name }}"
          release_version="${release_tag#hub-v}"
          revision="$(git rev-parse HEAD)"
          short_revision="$(git rev-parse --short=7 HEAD)"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          # GitHub's default docker driver cannot emit OCI attestations. Use an
          # isolated BuildKit container so SBOM and provenance remain attached
          # to the published multi-manifest image.
          docker buildx create --name hub-release --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --file deploy/hub/Dockerfile \
            --platform linux/amd64 \
            --tag "ghcr.io/k1412/dsh-hub:${release_version}" \
            --tag ghcr.io/k1412/dsh-hub:latest \
            --tag "ghcr.io/k1412/dsh-hub:sha-${short_revision}" \
            --label org.opencontainers.image.source=https://github.com/k1412/dsh-hub \
            --label "org.opencontainers.image.revision=${revision}" \
            --label "org.opencontainers.image.version=${release_version}" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${{ inputs.release_tag || github.ref_name }}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" dist/hub-release/* --clobber
          else
            gh release create "$release_tag" dist/hub-release/* --generate-notes --verify-tag
          fi
