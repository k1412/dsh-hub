name: Hub Release

on:
  push:
    tags:
      - 'hub-v*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: '22.22.1'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  release:
    name: Verify and publish Hub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Validate tag version
        run: |
          release_version="${GITHUB_REF_NAME#hub-v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$release_version" = "$package_version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run hub:typecheck
      - run: pnpm run hub:lint
      - run: pnpm run hub:test
      - run: pnpm run hub:web:build
      - run: pnpm run hub:server:verify
      - run: pnpm run hub:release:pack
      - run: pnpm run hub:release:verify
      - name: Create checksums
        run: sha256sum dist/hub-release/*.tgz > dist/hub-release/SHA256SUMS
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/k1412/dsh-hub
          tags: |
            type=match,pattern=hub-v(.*),group=1
            type=raw,value=latest
            type=sha
      - name: Publish Linux AMD64 container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/hub/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/hub-release/*
