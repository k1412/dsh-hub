name: Hub CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.1'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  core:
    name: Hub / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run hub:web:build
      - run: pnpm run hub:server:verify
      - run: pnpm run hub:release:pack
      - run: pnpm run hub:release:verify

  multi-node:
    name: Hub / simultaneous multi-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run two independent nodes concurrently
        run: pnpm exec vitest run packages/hub/hub-server/tests/multi-node.integration.spec.ts

  performance:
    name: Hub / performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure eight-node control and Fleet reads
        run: DSH_HUB_BENCHMARK_JSON=.artifacts/performance.json pnpm run performance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hub-performance
          path: .artifacts/performance.json

  web-regression:
    name: Hub / reviewed Web desktop and mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run hub:web:build
      - run: pnpm run hub:web:csp:verify
      - name: Verify Hub UI components and target switching
        run: pnpm exec vitest run packages/hub/hub-client-ui/tests apps/hub-web/tests

  windows:
    name: Hub / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: Parse Windows node installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'deploy/node/install-node.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: pnpm run hub:web:build

  documentation:
    name: Hub / public documentation and repository boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:check
      - run: pnpm run repo:check

  container:
    name: Hub / linux-amd64 container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/hub/Dockerfile
          platforms: linux/amd64
          push: false
          tags: dsh-hub:ci
          cache-from: type=gha,scope=hub-ci
          cache-to: type=gha,mode=max,scope=hub-ci
