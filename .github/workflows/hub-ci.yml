name: Hub CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.1'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  core:
    name: Hub / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run hub:web:build
      - run: pnpm run hub:server:verify
      - run: pnpm run hub:release:pack
      - run: pnpm run hub:release:verify

  multi-node:
    name: Hub / simultaneous multi-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run two independent nodes concurrently
        run: pnpm exec vitest run packages/hub/hub-server/tests/multi-node.integration.spec.ts

  performance:
    name: Hub / performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure eight-node control and Fleet reads
        run: DSH_HUB_BENCHMARK_JSON=.artifacts/performance.json pnpm run performance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hub-performance
          path: .artifacts/performance.json

  web-regression:
    name: Hub / reviewed Web desktop and mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run hub:web:build
      - name: Verify desktop/mobile interactions and record UI timings
        run: DSH_HUB_UI_BENCHMARK_JSON=.artifacts/ui-performance.json pnpm run hub:web:csp:verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hub-ui-performance
          path: .artifacts/ui-performance.json
      - name: Verify Hub UI components and target switching
        run: pnpm exec vitest run packages/hub/hub-client-ui/tests apps/hub-web/tests

  windows:
    name: Hub / Windows installer and client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Parse Windows node installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'deploy/node/install-node.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Run portable protocol and browser-client regressions
        run: pnpm exec vitest run packages/hub/hub-protocol/tests packages/hub/hub-capabilities/tests packages/hub/hub-client-ui/tests apps/hub-web/tests
      - run: pnpm run hub:web:build

  documentation:
    name: Hub / public documentation and repository boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:check
      - run: pnpm run repo:check

  container:
    name: Hub / linux-amd64 container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/hub/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: dsh-hub:ci
          cache-from: type=gha,scope=hub-ci
          cache-to: type=gha,mode=max,scope=hub-ci
      - name: Start hardened image and verify health plus origin isolation
        run: |
          docker volume create dsh-hub-ci-state
          docker run --detach --name dsh-hub-ci \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --volume dsh-hub-ci-state:/var/lib/dsh-hub \
            --publish 127.0.0.1:18080:8080 \
            --env DSH_HUB_OPERATOR_EMAILS=operator@example.com \
            --env DSH_HUB_CF_TEAM_DOMAIN=example.cloudflareaccess.com \
            --env DSH_HUB_CF_AUDIENCE=ci-audience \
            --env DSH_HUB_ORIGIN_SECRET=ci-private-origin-secret-at-least-32-chars \
            --env DSH_HUB_PUBLIC_ORIGIN=https://hub.example.com \
            dsh-hub:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' dsh-hub-ci)
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then docker logs dsh-hub-ci; exit 1; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' dsh-hub-ci)" = healthy
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/healthz)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'x-dsh-origin-secret: ci-private-origin-secret-at-least-32-chars' \
            http://127.0.0.1:18080/healthz)" = 200
          test "$(docker inspect --format '{{.Config.User}}' dsh-hub-ci)" = 10001:10001
      - name: Print container diagnostics on failure
        if: failure()
        run: docker logs dsh-hub-ci || true
      - name: Stop container fixture
        if: always()
        run: |
          docker rm --force dsh-hub-ci || true
          docker volume rm dsh-hub-ci-state || true
